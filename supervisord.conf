[supervisord]
nodaemon=true
user=appuser
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
loglevel=info

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
startretries=3
stdout_logfile=/tmp/nginx.out.log
stderr_logfile=/tmp/nginx.err.log

[program:node]
command=node server.mjs
directory=/app
autostart=true
autorestart=true
startretries=3
stdout_logfile=/tmp/node.out.log
stderr_logfile=/tmp/node.err.log
environment=PORT="3000",NODE_ENV="prod"