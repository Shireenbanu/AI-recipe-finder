server {
    listen 8080;
    server_name localhost;

    # INTERNAL container path (we will map your Mac folder to this)
    root /usr/share/nginx/html;
    index index.html;

    # 1. Handle API requests
    location /api/ {
        # Proxy to the Node.js process running in the same container
        proxy_pass http://localhost:3000;

        # 2. INCREASE TIMEOUTS for long-running AI/Gemini requests
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 3. Your Required Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 4. Standard Proxy Settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off; # Recommended for streaming AI responses
    }

    # Handle SPA routing for the frontend
    location / {
        try_files $uri $uri/ /index.html;
    }
}
